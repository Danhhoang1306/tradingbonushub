<script>
(function(){
  // Skip if lang cookie already exists (set by middleware or previous visit)
  if (document.cookie.match(/(?:^|;\s*)lang=/)) return;
  // Skip if ?lang= is in the URL (explicit choice)
  if (location.search.match(/[?&]lang=/)) return;

  // Fallback: call free GeoIP API (only when CF-IPCountry header is absent).
  // Site default is Vietnamese — only run the reload flow for VN visitors so
  // the cookie is persisted; non-VN visitors keep the server-rendered default.
  fetch('https://ip-api.com/json/?fields=countryCode', {mode:'cors'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.countryCode !== 'VN') return;
      document.cookie = 'lang=vi;path=/;max-age=31536000;samesite=lax';
      var sep = location.search ? '&' : '?';
      location.replace(location.href + sep + 'lang=vi');
    })
    .catch(function(){});
})();
</script>
