<!DOCTYPE html>
<html lang="{{ lang|default('en') }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — {{ ps.site_name or 'TradingBonusHub' }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:  {{ ps.primary_color or '#c8972a' }};
      --gold2: {{ ps.accent_color  or '#f0c040' }};
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #050d1e url('/static/bg-hero.svg') fixed center/cover no-repeat;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 100%; max-width: 400px; padding: 16px; }
    .logo {
      display: block; text-align: center; font-size: 22px; font-weight: 800; color: #fff;
      margin-bottom: 28px; letter-spacing: .3px; text-decoration: none;
    }
    .logo span { color: var(--gold2); }
    .card {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
      padding: 36px 32px;
    }
    h2 { font-size: 18px; color: #fff; margin-bottom: 6px; font-weight: 700; }
    .subtitle { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,.7); margin-bottom: 6px; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.18);
      border-radius: 9px; font-size: 14px; outline: none; transition: border-color .15s;
      color: #fff;
    }
    .form-group input::placeholder { color: rgba(255,255,255,.35); }
    .form-group input:focus { border-color: var(--gold2); }
    .btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0d1b3e; border: none; border-radius: 9px;
      font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 4px;
      transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .alert-success {
      background: rgba(40,167,69,.15); color: #66bb6a;
      border: 1px solid rgba(40,167,69,.3); border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px; text-align: center;
    }
    .hint { text-align: center; font-size: 13px; color: rgba(255,255,255,.5); margin-top: 18px; }
    .hint a { color: var(--gold2); text-decoration: none; font-weight: 600; }
    .hint a:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 28px 20px; } }
  </style>
</head>
<body>
<div class="wrap">
  <a href="/" class="logo">Trading<span>Bonus</span></a>
  <div class="card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to receive a password reset link</p>

    {% if sent %}
    <div class="alert-success">✅ Sent! Please check your inbox (including spam folder).</div>
    <a href="/portal/login" class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:0;">Back to Login</a>
    {% else %}
    {% if error %}
    <div style="background:rgba(220,53,69,.15);color:#f87171;border:1px solid rgba(220,53,69,.3);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center;">
      {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/portal/forgot-password">
      {{ csrf_input(request) }}
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" value="{{ email_val or '' }}" placeholder="email@example.com" required autofocus />
      </div>
      <button type="submit" class="btn">Send Password Reset Link</button>
    </form>
    {% endif %}

    <div class="hint"><a href="/portal/login">← Back to Login</a></div>
  </div>
</div>
</body>
</html>
