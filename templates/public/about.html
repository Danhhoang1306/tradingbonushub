{% extends "base_public.html" %}
{% from "public/_macros.html" import media %}
{% block content %}
<div class="about">
  <div class="about__blocks">
    {% for a in about_blocks %}
    <div class="about-block">
      <div class="about-block__n">{{ a.n }}</div>
      <h2 class="about-block__title">{{ a.title }}</h2>
      {% if a.text %}<p class="about-block__text">{{ a.text }}</p>{% endif %}
    </div>
    {% endfor %}
  </div>
  {{ media(about_image, page.title, "about__img") }}
</div>
{% endblock %}
