{% import "admin/_macros.html" as ui with context %}
<!doctype html>
<html lang="vi" class="no-js">
<head>
{% with page_title = "Đăng nhập" %}{% include "admin/_head.html" %}{% endwith %}
</head>
<body class="admin">
<main class="login-page">
  <form class="login-card" method="post" action="{{ action }}">
    <div class="login-brand">
      <img src="/static/img/logo.png" alt="" width="44" height="44">
      <span><span class="brand-name">TradingBonusHub</span><span class="brand-sub">Quản trị</span></span>
    </div>
    <h1>Đăng nhập</h1>
    {% if flash %}<div class="alert {{ 'alert-ok' if flash.kind == 'success' else 'alert-error' }}" role="status">{{ flash.text }}</div>{% endif %}
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    {{ ui.csrf() }}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required{% if not email %} autofocus{% endif %}>
    </label>
    <label class="field">
      <span class="field-label">Mật khẩu</span>
      <input type="password" name="password" autocomplete="current-password" required{% if email %} autofocus{% endif %}>
    </label>
    <button type="submit" class="btn-primary">Đăng nhập</button>
    <p class="login-foot"><a href="/">← Về trang chủ</a></p>
  </form>
</main>
</body>
</html>
