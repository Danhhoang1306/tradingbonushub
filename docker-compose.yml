version: "3.9"

services:
  app:
    build: .
    env_file: .env
    environment:
      DB_SERVER: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
      - ./email_templates:/app/email_templates
      - ./templates:/app/templates
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
