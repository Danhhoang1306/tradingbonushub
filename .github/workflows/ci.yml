name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ODBC Driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Lint with ruff
        run: |
          ruff check app/ tests/ --select E,F,W --ignore E501

      - name: Security audit dependencies
        run: |
          pip-audit --desc -r requirements.txt || true

      - name: Run unit tests
        env:
          SECRET_KEY: test-secret-key-ci
          FERNET_KEY: dGVzdC1mZXJuZXQta2V5LWRvLW5vdC11c2U=
          APP_ENV: test
          DB_SERVER: ""
          DB_NAME: TestDB
          DB_USER: test
          DB_PASSWORD: test
        run: |
          python -m pytest tests/ -v --tb=short -x

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t tradingbonushub:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker run --rm tradingbonushub:${{ github.sha }} python -c "import app; print('OK')"
